y="86" r="6" fill="#0c2220"/><circle cx="276" cy="86" r="6" fill="#0c2220"/><rect x="262" y="124" width="40" height="22" rx="8" fill="#0c2220"/><line x1="250" y1="135" x2="262" y2="135" stroke="#0c2220" stroke-width="3"/><text x="140" y="60" class="b">Sonic anemometer</text><text x="140" y="78" class="sm">measures wind speed in 3 directions</text><line x1="198" y1="84" x2="212" y2="96" stroke="#0c2220" stroke-width="1.5"/><text x="318" y="140" class="b">Gas analyzer</text><text x="318" y="158" class="sm">measures CO₂ concentration</text><line x1="304" y1="135" x2="314" y2="135" stroke="#0c2220" stroke-width="1.5"/><path d="M398,225 A32,32 0 1 1 456,215" fill="none" stroke="#2f6f86" stroke-width="3.5" marker-end="url(#arrb)"/><path d="M506,200 A24,24 0 1 0 548,190" fill="none" stroke="#2f6f86" stroke-width="3.5" marker-end="url(#arrb)"/><path d="M580,235 A30,30 0 1 1 634,225" fill="none" stroke="#2f6f86" stroke-width="3.5" marker-end="url(#arrb)"/><path d="M102,225 A28,28 0 1 0 152,215" fill="none" stroke="#2f6f86" stroke-width="3.5" marker-end="url(#arrb)"/><text x="520" y="120" class="sm c" style="fill:#2f6f86">swirling eddies of air</text><line x1="350" y1="325" x2="350" y2="262" stroke="#c08a34" stroke-width="4" marker-end="url(#arrg)"/><text x="262" y="290" class="sm" style="display:none"></text><text x="358" y="300" class="sm">CO₂ released</text><line x1="700" y1="250" x2="700" y2="322" stroke="#c08a34" stroke-width="4" marker-end="url(#arrg)"/><text x="590" y="316" class="sm" style="display:none"></text><text x="560" y="372" class="sm" style="display:none"></text><text x="690" y="240" class="sm c">CO₂ taken up</text><line x1="20" y1="200" x2="90" y2="200" stroke="#2f6f86" stroke-width="4" marker-end="url(#arrb)"/><text x="20" y="190" class="sm" style="fill:#2f6f86">wind</text><text x="380" y="30" class="lg c">An eddy covariance tower</text><text x="380" y="404" class="c b">Salt marsh (tidal wetland)</text><text x="380" y="428" class="c sm">Many times per second the tower pairs “how fast is the air moving up or down?” with “how much CO₂ is in that air?”</text>
